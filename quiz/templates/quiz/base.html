<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f6f7fb;
        }
        .btn-gold {
            background: linear-gradient(90deg, #ffb347 0%, #ffcc33 100%);
            color: #222;
        }
        .btn-teal {
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            color: #222;
        }
        .btn-purple {
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            color: #222;
        }
        .btn-green {
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }
        .btn-orange {
            background: linear-gradient(90deg, #ff9966 0%, #ff5e62 100%);
            color: #fff;
        }
        .btn-red {
            background: linear-gradient(90deg, #f85032 0%, #e73827 100%);
            color: #fff;
        }
        .futuristic-btn {
            border: none;
            border-radius: 999px;
            padding: 0.85rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 16px 0 rgba(0,0,0,0.10);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
            outline: none;
            position: relative;
            overflow: hidden;
            margin: 0 0.2rem;
        }
        .futuristic-btn:hover, .futuristic-btn:focus {
            filter: brightness(1.08) saturate(1.2);
            transform: scale(1.04);
            box-shadow: 0 4px 32px 0 rgba(0,0,0,0.18);
        }
        .futuristic-btn:active {
            transform: scale(0.98);
        }
        .futuristic-card {
            background: #fff;
            border-radius: 1.25rem;
            box-shadow: 0 4px 32px 0 rgba(0,0,0,0.10);
            padding: 2.5rem 2rem 2rem 2rem;
            margin: 1.5rem 0;
        }
        .futuristic-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }
        .futuristic-label {
            color: #444;
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
            display: block;
            font-weight: 600;
        }
        .futuristic-input, .futuristic-select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 0.75rem;
            border: 1.5px solid #e0e0e0;
            background: rgba(255,255,255,0.5);
            color: #222;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            outline: none;
            font-family: 'Inter', Arial, sans-serif;
        }
        .futuristic-input:focus, .futuristic-select:focus {
            border-color: #ffcc33;
            box-shadow: 0 0 8px #ffcc33aa;
        }
        .footer {
            text-align: center;
            color: #888;
            font-size: 1rem;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
        }
        .animal-icon {
            font-size: 2.2rem;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        .timer {
            font-family: 'Inter', monospace;
            font-size: 1.5rem;
            color: #00bcd4;
            text-shadow: none;
            font-weight: 700;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="bg-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between">
                <div class="flex space-x-7">
                    <div>
                        <a href="{% url 'home' %}" class="flex items-center py-4">
                            <span class="animal-icon">🐾</span>
                            <span class="font-semibold text-gray-700 text-lg tracking-wide">Quiz App</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <footer class="bg-white shadow-lg mt-8">
        <div class="container mx-auto px-4 py-4">
            <p class="text-center text-gray-500">&copy; 2024 Quiz App. All rights reserved.</p>
        </div>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
