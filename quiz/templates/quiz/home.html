{% extends 'quiz/base.html' %}
{% load static %}

{% block title %}Home - Quiz App{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 to-black text-white">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
                AI Quiz Generator
            </h1>
            <a href="{% url 'recent_quizzes' %}" 
               class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-500 rounded-lg hover:from-blue-600 hover:to-purple-600 transition-all duration-300 transform hover:scale-105">
                View Recent Quizzes
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
            <!-- File Upload Section -->
            <div class="glass-card p-8 rounded-xl">
                <h2 class="text-2xl font-semibold mb-6 text-purple-300">Upload Quiz File</h2>
                <form method="post" enctype="multipart/form-data" class="space-y-6" action="{% url 'create_quiz_from_file' %}">
                    {% csrf_token %}
                    <div>
                        <label for="quiz_file" class="block text-sm font-medium text-gray-300 mb-2">Upload Quiz File</label>
                        <input type="file" name="quiz_file" id="quiz_file" accept=".csv,.xlsx,.xls" required
                               class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white"
                               placeholder="Upload Excel or CSV file">
                        <p class="text-sm text-gray-400 mt-1">Supported formats: CSV, Excel (.xlsx, .xls)</p>
                    </div>
                    <div>
                        <label for="time_limit_file" class="block text-sm font-medium text-gray-300 mb-2">Time Limit (minutes)</label>
                        <input type="number" name="time_limit" id="time_limit_file" required min="1" max="60" value="10"
                               class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white"
                               placeholder="Enter time limit in minutes">
                    </div>
                    <button type="submit" class="w-full bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                        Create Quiz from File
                    </button>
                </form>
            </div>

            <!-- AI Generation Section -->
            <div class="glass-card p-8 rounded-xl">
                <h2 class="text-2xl font-semibold mb-6 text-purple-300">Generate Quiz with AI</h2>
                <form method="post" class="space-y-6" action="{% url 'create_quiz_with_ai' %}">
                    {% csrf_token %}
                    <div>
                        <label for="topic" class="block text-sm font-medium text-gray-300 mb-2">Quiz Topic</label>
                        <input type="text" name="topic" id="topic" required
                               class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white"
                               placeholder="Enter a topic for your quiz">
                    </div>
                    <div>
                        <label for="num_questions" class="block text-sm font-medium text-gray-300 mb-2">Number of Questions</label>
                        <input type="number" name="num_questions" id="num_questions" required min="1" max="20" value="5"
                               class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white"
                               placeholder="Enter number of questions (1-20)">
                    </div>
                    <div>
                        <label for="time_limit_ai" class="block text-sm font-medium text-gray-300 mb-2">Time Limit (minutes)</label>
                        <input type="number" name="time_limit" id="time_limit_ai" required min="1" max="60" value="10"
                               class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white"
                               placeholder="Enter time limit in minutes">
                    </div>
                    <button type="submit" class="w-full bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                        Generate Quiz with AI
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.glass-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.glass-card:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
}

input:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.5);
}
</style>
{% endblock %}
